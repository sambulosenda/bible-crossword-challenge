<style>
  :root{--paper:#FBFAF6; --ink:#141416; --ink-soft:#3D3D40; --muted:#6E6D68; --blue:#0B7BFF; --gilt:#B8922E;}
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
    display:grid; place-items:center; text-align:center; padding:24px;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .eyebrow{font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gilt); margin:0 0 18px}
  h1{font-family:"Libre Caslon Display", Georgia, serif; font-weight:400; font-size:clamp(32px, 6vw, 52px); margin:0 0 14px; line-height:1.1}
  p{color:var(--ink-soft); font-size:17px; max-width:44ch; margin:0 auto 30px}
  a.btn{display:inline-block; background:var(--ink); color:#fff; text-decoration:none; padding:13px 26px; border-radius:12px; font-weight:600; font-size:16px}
  a.btn:hover{background:#000}
</style>
</head>
<body>
<main>
  <p class="eyebrow">4 Down &middot; 4 Across</p>
  <h1>This square is blank.</h1>
  <p>The page you&rsquo;re looking for isn&rsquo;t in this grid. Head back home and today&rsquo;s puzzle will be waiting.</p>

</body>
